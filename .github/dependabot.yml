version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /
      - /examples/gattify-lab/src-tauri
      - /fuzz
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /crates/tauri-plugin-gattify/android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
