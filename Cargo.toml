[workspace]
members = ["crates/tauri-plugin-gattify"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hoangmirs/gattify"

[workspace.dependencies]
async-trait = "=0.1.92"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", default-features = false }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
