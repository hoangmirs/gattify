[workspace]
members = [
  "crates/ble-core",
  "crates/ble-peer",
  "crates/tauri-plugin-ble",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hoangmirs/tauri-ble"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
ble-core = { path = "crates/ble-core" }
ble-peer = { path = "crates/ble-peer" }
parking_lot = "0.12.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.11.5", default-features = false }
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
