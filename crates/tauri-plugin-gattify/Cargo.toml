[package]
name = "tauri-plugin-gattify"
description = "Tauri v2 BLE plugin with raw GATT and complete messages between phones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "tauri-plugin-gattify"

[features]
default = ["tauri"]
# The Windows backend runs only inside the plugin, so its WinRT crates come with it.
tauri = [
    "dep:tauri",
    "dep:tauri-plugin",
    "dep:windows",
    "dep:windows-collections",
    "dep:windows-future",
]
mock = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, optional = true, features = ["wry"] }

# The versions Tauri already uses on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation",
    "Storage_Streams",
] }
windows-collections = { version = "=0.2.0", optional = true }
# Its std feature makes WinRT async operations awaitable.
windows-future = { version = "=0.2.1", optional = true }

[build-dependencies]
serde_json.workspace = true
tauri-plugin = { version = "=2.6.3", features = ["build"], optional = true }

[dev-dependencies]
futures-lite = "=2.6.1"
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
